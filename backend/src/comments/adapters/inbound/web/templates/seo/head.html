<title>{{ title }}</title>
    <meta name="description" content="{{ description }}" />
    <meta name="robots" content="{{ robots }}" />
    <link rel="canonical" href="{{ canonical }}" />
    {% for alt in alternates %}<link rel="alternate" hreflang="{{ alt.hreflang }}" href="{{ alt.href }}" />
    {% endfor %}{% if prev_url %}<link rel="prev" href="{{ prev_url }}" />
    {% endif %}{% if next_url %}<link rel="next" href="{{ next_url }}" />
    {% endif %}<meta property="og:site_name" content="Threadline" />
    <meta property="og:type" content="{{ og_type }}" />
    <meta property="og:title" content="{{ title }}" />
    <meta property="og:description" content="{{ description }}" />
    <meta property="og:url" content="{{ canonical }}" />
    <meta property="og:image" content="{{ og_image }}" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="{{ og_locale }}" />
    <meta name="twitter:card" content="summary_large_image" />
    {% for ld in json_ld %}<script type="application/ld+json">{{ ld|safe }}</script>
    {% endfor %}
