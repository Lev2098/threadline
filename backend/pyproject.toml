[project]
name = "dzen-comments"
version = "1.0.0"
description = "SPA comments service: Django + hexagonal architecture"
requires-python = ">=3.12"
dependencies = [
    "Django>=5.2,<6.0",
    "djangorestframework>=3.15,<4.0",
    "drf-spectacular>=0.28,<1.0",
    "django-cors-headers>=4.4,<5.0",
    "django-redis>=5.4,<7.0",
    "channels>=4.1,<5.0",
    "channels-redis>=4.2,<5.0",
    "strawberry-graphql[channels]>=0.240,<1.0",
    "celery>=5.4,<6.0",
    "elasticsearch>=8.15,<9.0",
    "psycopg[binary,pool]>=3.2,<4.0",
    "redis>=5.0,<7.0",
    "Pillow>=11.0,<13.0",
    "nh3>=0.2.18,<1.0",
    "PyJWT>=2.9,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
    "whitenoise>=6.7,<7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9.0",
    "pytest-django>=4.9,<5.0",
    "pytest-cov>=5.0,<7.0",
    "daphne>=4.1,<5.0",  # required by channels.testing
    "ruff>=0.7,<1.0",
    "mypy>=1.13,<2.0",
    "import-linter>=2.1,<3.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
DJANGO_SETTINGS_MODULE = "tests.settings"
addopts = "-q --strict-markers"
filterwarnings = ["ignore:No directory at:UserWarning"]
markers = ["integration: needs PostgreSQL/Redis (run inside docker compose)"]

[tool.ruff]
line-length = 120
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S", "DJ", "RUF"]
ignore = ["S101", "RUF012"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106"]
"src/comments/adapters/outbound/persistence/migrations/**" = ["E501", "RUF"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true
ignore_missing_imports = true
exclude = ["migrations/"]

[[tool.mypy.overrides]]
module = ["comments.adapters.*", "config.*"]
disallow_untyped_decorators = false
disallow_subclassing_any = false
# Django ships without type stubs here; framework calls return Any.
warn_return_any = false
warn_unused_ignores = false
