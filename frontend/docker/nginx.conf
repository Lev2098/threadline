# Edge proxy: serves the SPA and media, forwards API / GraphQL / WebSocket to Django.

upstream backend {          # HTTP API: gunicorn (WSGI)
    server backend:8000;
    keepalive 32;
    keepalive_timeout 50s;  # shorter than gunicorn --keep-alive 75: nginx closes first, no reset race
}

upstream realtime {         # WebSockets: uvicorn (ASGI, Channels)
    server realtime:8000;
}

# Per-IP limits in front of Django's per-client throttles: cheap to enforce here,
# and abusive traffic never reaches Python.
map $request_method $write_key {
    POST    $binary_remote_addr;
    default "";            # empty key = not counted, so GETs only hit api_read
}
limit_req_zone $binary_remote_addr zone=api_read:10m rate=30r/s;
limit_req_zone $write_key zone=api_write:10m rate=2r/s;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header X-Frame-Options DENY always;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    location = /nginx-health {
        access_log off;
        return 200 "ok";
    }

    location /api/v1/comments {
        limit_req zone=api_read burst=60 nodelay;
        limit_req zone=api_write burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://backend;
    }

    location /api/ {
        limit_req zone=api_read burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://backend;
    }

    location /graphql {
        limit_req zone=api_read burst=30 nodelay;
        limit_req_status 429;
        proxy_pass http://backend;
    }

    location /ws/ {
        proxy_pass http://realtime;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location ~ ^/(admin|static|healthz|readyz) {
        proxy_pass http://backend;
    }

    # User uploads: never executable, never sniffed into HTML.
    location /media/ {
        alias /srv/media/;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; sandbox" always;
        charset utf-8;
        charset_types text/plain;
        types {
            image/jpeg jpg jpeg;
            image/png png;
            image/gif gif;
            text/plain txt;
        }
        default_type application/octet-stream;
    }

    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Content-Type-Options nosniff always;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy same-origin always;
        add_header X-Frame-Options DENY always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self' ws: wss:; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
    }
}
